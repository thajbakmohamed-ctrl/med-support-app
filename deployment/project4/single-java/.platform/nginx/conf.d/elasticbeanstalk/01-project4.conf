client_max_body_size 6m;
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    try_files $uri =404;
}

# Keep EB's generated default location and health logging. Exact/static locations
# below serve the frontend without defining a conflicting second location /.
location = / {
    root /var/app/current/frontend;
    try_files /index.html =404;
}
location ~ ^/(index\.html|app\.js|styles\.css|config\.js)$ {
    root /var/app/current/frontend;
    add_header Cache-Control 'no-store';
    try_files $uri =404;
}
location = /healthz { return 200 'proxy alive\n'; }
location = /identity/actuator/health {
    include conf.d/00-proxy.inc;
    proxy_pass http://127.0.0.1:8083/actuator/health;
}
location = /booking/actuator/health {
    include conf.d/00-proxy.inc;
    proxy_pass http://127.0.0.1:8084/actuator/health;
}
location = /blood/actuator/health {
    include conf.d/00-proxy.inc;
    proxy_pass http://127.0.0.1:8085/actuator/health;
}
location = /notification/actuator/health {
    include conf.d/00-proxy.inc;
    proxy_pass http://127.0.0.1:8086/actuator/health;
}

# Block the generated default proxy's unprefixed API and all internal APIs.
location ^~ /api/ { return 404; }
location ~ ^/(identity/api/internal|notification/api/notifications/internal)(/|$) {
    return 404;
}
location /identity/ {
    if ($scheme != https) { return 426; }
    include conf.d/00-proxy.inc;
    proxy_pass http://127.0.0.1:8083/;
}
location /booking/ {
    if ($scheme != https) { return 426; }
    include conf.d/00-proxy.inc;
    proxy_pass http://127.0.0.1:8084/;
}
location /blood/ {
    if ($scheme != https) { return 426; }
    include conf.d/00-proxy.inc;
    proxy_pass http://127.0.0.1:8085/;
}
location /notification/ {
    if ($scheme != https) { return 426; }
    include conf.d/00-proxy.inc;
    proxy_pass http://127.0.0.1:8086/;
}
location = /ws/notifications {
    if ($scheme != https) { return 426; }
    include conf.d/00-proxy.inc;
    proxy_pass http://127.0.0.1:8086/ws/notifications;
    proxy_buffering off;
}
