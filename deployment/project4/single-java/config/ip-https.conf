# Opt-in only: installed after a trusted IP certificate exists; never auto-issues.
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/med-support-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/med-support-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include conf.d/elasticbeanstalk/01-project4.conf;
    include conf.d/elasticbeanstalk/healthd.conf;
}
