# Deployment-only additions. Existing application.properties remain in each JAR.
server.address=127.0.0.1
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:postgresql://${RDS_HOST:${RDS_HOSTNAME:}}:${RDS_PORT:5432}/${RDS_DATABASE:${RDS_DB_NAME:med_support}}?sslmode=verify-full&sslrootcert=/var/app/current/certs/global-bundle.pem
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
services.identity.url=http://127.0.0.1:8083
services.booking.url=http://127.0.0.1:8084
services.blood-request.url=http://127.0.0.1:8085
services.notification.url=http://127.0.0.1:8086
app.frontend-origin=${APP_FRONTEND_ORIGIN}
app.frontend-url=${APP_FRONTEND_ORIGIN}
app.upload-dir=${APP_UPLOAD_DIR:/var/app/p4-uploads}
app.admin.seed.enabled=false
spring.kafka.bootstrap-servers=127.0.0.1:19092
app.notification.recovery.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.from=${MAIL_USERNAME}
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.debug=false
