spring.application.name=booking-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5433/med_support
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Microservice communication
services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8083}
services.blood-request.url=${BLOOD_REQUEST_SERVICE_URL:http://localhost:8085}

# Notification Service
services.notification.url=http://localhost:8086

# Internal microservice authentication
internal.service.api-key=${NOTIFICATION_SERVICE_KEY}


# Apache Kafka - Booking Service (Producer)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Booking events topic
app.kafka.booking-topic=booking-events

# Producer serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Producer reliability
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Check for pending outbox events every 5 seconds
app.outbox.poll-interval-ms=5000
# Secure communication with Identity Service
internal.identity.api-key=${IDENTITY_SERVICE_KEY}


# REST communication timeouts
app.rest.connect-timeout-ms=3000
app.rest.read-timeout-ms=5000
# Minimal operational surface; never expose environment/configuration endpoints.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
springdoc.swagger-ui.persist-authorization=false
