spring.application.name=booking-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5433/med_support_booking
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Microservice communication
services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8083}
services.blood-request.url=${BLOOD_REQUEST_SERVICE_URL:http://localhost:8085}
