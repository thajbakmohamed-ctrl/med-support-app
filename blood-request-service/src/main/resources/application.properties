spring.application.name=blood-request-service

# Server
server.port=8085

# PostgreSQL
spring.datasource.url=jdbc:postgresql://med-support-db.c6hucmaaukax.us-east-1.rds.amazonaws.com/med_support
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Actuator
# Microservice communication
services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8083}

app.rest.connect-timeout-ms=3000
app.rest.read-timeout-ms=5000
# Minimal operational surface; never expose environment/configuration endpoints.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
springdoc.swagger-ui.persist-authorization=false

spring.cache.type=caffeine
spring.cache.cache-names=hospitals,hospital
spring.cache.caffeine.spec=${HOSPITAL_CACHE_SPEC:maximumSize=200,expireAfterWrite=60s}
