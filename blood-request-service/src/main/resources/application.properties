spring.application.name=blood-request-service

# Server
server.port=8085

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/med_support
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info
# Microservice communication
services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8083}

app.rest.connect-timeout-ms=3000
app.rest.read-timeout-ms=5000