
spring.application.name=notification-service

# Keep live inbox refresh independent of the SMTP worker.
spring.task.scheduling.pool.size=2

# Notification Service Port
server.port=8086

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://med-support-db.c6hucmaaukax.us-east-1.rds.amazonaws.com/med_support
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Identity Service
services.identity.url=http://localhost:8083

# Booking Service
services.booking.url=http://localhost:8084

# Blood Request Service
services.blood-request.url=http://localhost:8085

# Email Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Internal microservice authentication
internal.service.api-key=${NOTIFICATION_SERVICE_KEY}


# Apache Kafka - Notification Service (Consumer)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Booking events topic
app.kafka.booking-topic=booking-events

# Consumer group
spring.kafka.consumer.group-id=notification-service

# Consumer deserialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer


# Allow the booking event package for JSON deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.medsupport.booking_service.event,com.medsupport.notification_service.event

# Avoid relying on producer Java class names
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.medsupport.notification_service.event.BookingNotificationEvent

# Consumer should process events from the beginning if no offset exists
spring.kafka.consumer.auto-offset-reset=earliest

# Automatic email notification processing
app.notification.email.poll-interval-ms=10000

# SMTP timeouts (milliseconds)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# PostgreSQL worker coordination timeouts
app.notification.worker-lock.connect-timeout-seconds=5
app.notification.worker-lock.socket-timeout-seconds=10
app.notification.worker-lock.query-timeout-seconds=5

# Email recovery - disabled until rollout verification
app.notification.recovery.enabled=false

# Recover candidates older than 5 minutes
app.notification.recovery.stale-after-seconds=300

# Maximum candidates per recovery run
app.notification.recovery.batch-size=20

# Recovery scheduler interval: 60 seconds
app.notification.recovery.poll-interval-ms=60000

# Kafka error handling
app.kafka.dlt-topic=booking-events-dlt
# Minimal operational surface; never expose environment/configuration endpoints.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
springdoc.swagger-ui.persist-authorization=false
